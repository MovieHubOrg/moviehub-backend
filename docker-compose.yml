services:
  mysql:
    image: mysql:8.4.5
    container_name: movie-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - ./data/mysql:/var/lib/mysql
    networks:
      - movie-networks
    restart: unless-stopped

  redis:
    image: redis:8.2.1
    container_name: movie-redis
    command: ['redis-server', '--requirepass', 'admin123654', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    networks:
      - movie-networks
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: movie-rabbitmq
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./data/rabbitmq:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - movie-networks
    restart: unless-stopped

networks:
  movie-networks:
    driver: bridge

# docker compose up -d
# -d: background mode